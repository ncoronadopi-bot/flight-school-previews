<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2444"/>
      <stop offset="100%" stop-color="#091a33"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Room walls -->
  <rect x="0" y="0" width="800" height="500" fill="url(#wall)" opacity="0.6"/>
  <!-- Floor -->
  <rect x="0" y="480" width="800" height="120" fill="#0f172a"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Whiteboard / briefing board on wall -->
  <rect x="120" y="60" width="400" height="260" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
  <!-- Board content: flight route map -->
  <g transform="translate(120, 60)">
    <!-- Title bar -->
    <rect width="400" height="30" rx="4" fill="#0f2444"/>
    <text x="200" y="20" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold" opacity="0.9">FLIGHT BRIEFING — VFR CROSS-COUNTRY</text>

    <!-- Route map area -->
    <rect x="20" y="40" width="260" height="200" rx="4" fill="#091a33" opacity="0.8"/>
    <!-- Coastline outline -->
    <path d="M30,60 Q50,80 45,110 Q40,140 55,170 Q65,195 70,230" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <!-- Route line -->
    <path d="M80,220 L120,160 L160,100 L210,80 L260,90" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="6,3" opacity="0.8"/>
    <!-- Waypoints -->
    <circle cx="80" cy="220" r="5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="120" cy="160" r="4" fill="#fbbf24" opacity="0.6"/>
    <circle cx="160" cy="100" r="4" fill="#fbbf24" opacity="0.6"/>
    <circle cx="210" cy="80" r="4" fill="#fbbf24" opacity="0.6"/>
    <circle cx="260" cy="90" r="5" fill="#38bdf8" opacity="0.8"/>
    <!-- Labels -->
    <text x="60" y="215" font-family="monospace" font-size="7" fill="#fbbf24" opacity="0.7">KPMP</text>
    <text x="245" y="85" font-family="monospace" font-size="7" fill="#38bdf8" opacity="0.7">KOPF</text>
    <!-- Wind arrow -->
    <text x="220" y="150" font-family="monospace" font-size="8" fill="#94a3b8" opacity="0.5">↗ 12kts</text>

    <!-- Weather data panel -->
    <rect x="295" y="40" width="90" height="200" rx="4" fill="#091a33" opacity="0.8"/>
    <text x="340" y="60" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle" opacity="0.8" font-weight="bold">METAR</text>
    <text x="340" y="78" font-family="monospace" font-size="7" fill="#94a3b8" text-anchor="middle" opacity="0.6">KPMP</text>
    <text x="340" y="94" font-family="monospace" font-size="7" fill="#e2e8f0" text-anchor="middle" opacity="0.7">SKC</text>
    <text x="340" y="110" font-family="monospace" font-size="7" fill="#e2e8f0" text-anchor="middle" opacity="0.7">VIS 10+</text>
    <text x="340" y="126" font-family="monospace" font-size="7" fill="#e2e8f0" text-anchor="middle" opacity="0.7">WND 090</text>
    <text x="340" y="142" font-family="monospace" font-size="7" fill="#e2e8f0" text-anchor="middle" opacity="0.7">12KT</text>
    <text x="340" y="165" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle" opacity="0.8" font-weight="bold">NOTAM</text>
    <text x="340" y="181" font-family="monospace" font-size="6" fill="#94a3b8" text-anchor="middle" opacity="0.5">RWY 10/28</text>
    <text x="340" y="195" font-family="monospace" font-size="6" fill="#94a3b8" text-anchor="middle" opacity="0.5">AVBL</text>

    <!-- Altitude profile below -->
    <rect x="20" y="248" width="360" height="8" rx="2" fill="#0f2444"/>
    <path d="M20,252 L80,248 L120,244 L180,240 L240,244 L300,248 L360,252 L380,252" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <text x="20" y="242" font-family="monospace" font-size="7" fill="#94a3b8" opacity="0.5">ALT PROFILE</text>
  </g>

  <!-- Instructor figure (left) -->
  <g transform="translate(600, 200)" fill="#0f2444" stroke="#38bdf8" stroke-width="1">
    <!-- Head -->
    <circle cx="0" cy="-110" r="28" fill="#1e3a5f"/>
    <!-- Hair/cap -->
    <path d="M-28,-110 Q-30,-140 0,-145 Q30,-140 28,-110" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <!-- Face details -->
    <circle cx="-8" cy="-114" r="4" fill="#0f172a"/>
    <circle cx="8" cy="-114" r="4" fill="#0f172a"/>
    <path d="M-8,-100 Q0,-95 8,-100" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
    <!-- Body / uniform -->
    <path d="M-28,-82 L-35,60 L35,60 L28,-82Z" fill="#0c4a6e"/>
    <!-- Epaulettes -->
    <rect x="-35" y="-78" width="14" height="8" rx="2" fill="#fbbf24" opacity="0.7"/>
    <rect x="21" y="-78" width="14" height="8" rx="2" fill="#fbbf24" opacity="0.7"/>
    <!-- Tie -->
    <path d="M0,-82 L-6,-30 L0,-20 L6,-30Z" fill="#0369a1"/>
    <!-- Pointing arm -->
    <path d="M-28,-40 L-90,-15 L-92,-5 L-22,-30Z" fill="#0c4a6e"/>
    <!-- Other arm (holding chart) -->
    <path d="M28,-40 L65,10 L62,20 L22,-30Z" fill="#0c4a6e"/>
    <rect x="55" y="0" width="40" height="55" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <!-- Legs -->
    <rect x="-28" y="60" width="22" height="80" rx="5" fill="#0c4a6e"/>
    <rect x="6" y="60" width="22" height="80" rx="5" fill="#0c4a6e"/>
    <!-- Shoes -->
    <ellipse cx="-17" cy="144" rx="14" ry="7" fill="#0f172a"/>
    <ellipse cx="17" cy="144" rx="14" ry="7" fill="#0f172a"/>
    <!-- Wings badge on chest -->
    <path d="M-15,-55 L-22,-48 L-15,-45 L0,-50 L15,-45 L22,-48 L15,-55Z" fill="#fbbf24" opacity="0.6"/>
  </g>

  <!-- Student figure (right) -->
  <g transform="translate(700, 230)" fill="#0f2444" stroke="#38bdf8" stroke-width="1">
    <circle cx="0" cy="-90" r="24" fill="#1e3a5f"/>
    <path d="M-25,-60 L-30,50 L30,50 L25,-60Z" fill="#091a33"/>
    <!-- Listening posture - arms at sides -->
    <path d="M-25,-30 L-50,10 L-46,20 L-20,-20Z" fill="#091a33"/>
    <path d="M25,-30 L50,10 L46,20 L20,-20Z" fill="#091a33"/>
    <rect x="-22" y="50" width="18" height="65" rx="4" fill="#091a33"/>
    <rect x="4" y="50" width="18" height="65" rx="4" fill="#091a33"/>
    <ellipse cx="-13" cy="118" rx="11" ry="6" fill="#0f172a"/>
    <ellipse cx="13" cy="118" rx="11" ry="6" fill="#0f172a"/>
    <!-- Notepad -->
    <rect x="30" y="-5" width="28" height="40" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <line x1="34" y1="4" x2="54" y2="4" stroke="#94a3b8" stroke-width="0.8" opacity="0.4"/>
    <line x1="34" y1="12" x2="54" y2="12" stroke="#94a3b8" stroke-width="0.8" opacity="0.4"/>
    <line x1="34" y1="20" x2="54" y2="20" stroke="#94a3b8" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Pointer line from instructor to board -->
  <line x1="510" y1="360" x2="520" y2="280" stroke="#38bdf8" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>

  <!-- Label -->
  <text x="30" y="570" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" opacity="0.7" letter-spacing="3">INSTRUCTOR BRIEFING · PRE-FLIGHT PLANNING</text>
</svg>
