<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="70%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2f1a"/>
      <stop offset="100%" stop-color="#0f1f0f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Ground -->
  <rect x="0" y="400" width="800" height="200" fill="url(#ground)"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Tarmac area in front of building -->
  <rect x="0" y="440" width="800" height="160" fill="#1e293b" opacity="0.5"/>

  <!-- Palm trees (Florida flavor) -->
  <g transform="translate(60, 390)" fill="#0f2444">
    <rect x="-4" y="-80" width="8" height="80"/>
    <path d="M0,-80 Q-40,-100 -70,-80 Q-40,-70 0,-80Z" fill="#1a2f1a"/>
    <path d="M0,-80 Q40,-100 65,-75 Q35,-65 0,-80Z" fill="#1a2f1a"/>
    <path d="M0,-80 Q-20,-115 0,-130 Q20,-115 0,-80Z" fill="#1a2f1a"/>
    <path d="M0,-80 Q-50,-90 -55,-110 Q-20,-95 0,-80Z" fill="#1a2f1a"/>
    <path d="M0,-80 Q50,-90 55,-110 Q20,-95 0,-80Z" fill="#1a2f1a"/>
  </g>
  <g transform="translate(740, 380)" fill="#0f2444">
    <rect x="-3" y="-70" width="6" height="70"/>
    <path d="M0,-70 Q-35,-88 -60,-68 Q-33,-60 0,-70Z" fill="#1a2f1a"/>
    <path d="M0,-70 Q35,-88 58,-65 Q30,-58 0,-70Z" fill="#1a2f1a"/>
    <path d="M0,-70 Q-15,-100 0,-115 Q15,-100 0,-70Z" fill="#1a2f1a"/>
  </g>

  <!-- Main building — Pompano Flight Training FBO -->
  <!-- Building body -->
  <rect x="100" y="220" width="600" height="195" fill="#0f2444" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Roof line with slight pitch -->
  <path d="M80,220 L400,175 L720,220Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
  <!-- Roof overhang -->
  <rect x="80" y="218" width="640" height="10" fill="#091a33"/>

  <!-- Sign on building -->
  <rect x="200" y="235" width="400" height="50" rx="4" fill="#091a33" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="255" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle" font-weight="700" opacity="0.9">POMPANO FLIGHT TRAINING</text>
  <text x="400" y="275" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" opacity="0.7" letter-spacing="3">POMPANO BEACH AIRPARK · KPMP</text>

  <!-- Windows row -->
  <g fill="#0284c7" opacity="0.2" stroke="#38bdf8" stroke-width="1">
    <rect x="120" y="295" width="70" height="55" rx="3"/>
    <rect x="210" y="295" width="70" height="55" rx="3"/>
    <rect x="300" y="295" width="70" height="55" rx="3"/>
    <rect x="430" y="295" width="70" height="55" rx="3"/>
    <rect x="520" y="295" width="70" height="55" rx="3"/>
    <rect x="610" y="295" width="70" height="55" rx="3"/>
  </g>
  <!-- Window light effect -->
  <g fill="#fbbf24" opacity="0.05">
    <rect x="120" y="295" width="70" height="55" rx="3"/>
    <rect x="300" y="295" width="70" height="55" rx="3"/>
    <rect x="520" y="295" width="70" height="55" rx="3"/>
  </g>

  <!-- Main entrance door -->
  <rect x="355" y="340" width="90" height="75" rx="4" fill="#091a33" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Door handle -->
  <circle cx="390" cy="378" r="4" fill="#38bdf8" opacity="0.6"/>
  <!-- Glass door panels -->
  <rect x="358" y="343" width="38" height="70" rx="2" fill="#0284c7" opacity="0.15"/>
  <rect x="400" y="343" width="42" height="70" rx="2" fill="#0284c7" opacity="0.15"/>

  <!-- Canopy over entrance -->
  <path d="M320,340 L480,340 L470,320 L330,320Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
  <!-- Canopy supports -->
  <line x1="340" y1="340" x2="340" y2="415" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="340" x2="460" y2="415" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

  <!-- Windsock pole -->
  <line x1="680" y1="160" x2="680" y2="400" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
  <!-- Windsock -->
  <path d="M680,170 L720,178 L730,192 L715,204 L680,200Z" fill="#fbbf24" opacity="0.5"/>
  <line x1="680" y1="160" x2="700" y2="155" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

  <!-- N-number plane parked at left -->
  <g transform="translate(150, 450) scale(0.6)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="80" ry="12" fill="#0f2444"/>
    <path d="M-8,-8 L-25,-35 L28,-34 L35,-8Z" fill="#0c4a6e"/>
    <path d="M-8,8 L-25,30 L28,29 L35,8Z" fill="#0c4a6e"/>
    <circle cx="80" cy="4" r="20" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Parking spots on tarmac -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.1">
    <line x1="200" y1="480" x2="200" y2="580"/>
    <line x1="300" y1="480" x2="300" y2="580"/>
    <line x1="400" y1="480" x2="400" y2="580"/>
    <line x1="500" y1="480" x2="500" y2="580"/>
    <line x1="600" y1="480" x2="600" y2="580"/>
  </g>

  <!-- Label -->
  <text x="30" y="575" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" opacity="0.7" letter-spacing="3">TRAINING FACILITIES · KPMP</text>
</svg>
