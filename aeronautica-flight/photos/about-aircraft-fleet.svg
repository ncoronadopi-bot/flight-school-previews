<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="60%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f2444"/>
    </linearGradient>
    <linearGradient id="tarmac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- Ground/tarmac -->
  <rect x="0" y="380" width="800" height="220" fill="url(#tarmac)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Hangar background -->
  <g opacity="0.35">
    <rect x="0" y="150" width="800" height="250" fill="#0f2444"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
    <!-- Hangar door sections -->
    <line x1="200" y1="150" x2="200" y2="400" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
    <line x1="400" y1="150" x2="400" y2="400" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
    <line x1="600" y1="150" x2="600" y2="400" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
    <!-- Hangar sign -->
    <rect x="310" y="160" width="180" height="30" rx="3" fill="#091a33"/>
    <text x="400" y="180" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle" font-weight="700" opacity="0.8">FLEET HANGAR</text>
  </g>

  <!-- Aircraft 1 - Cessna 172 (leftmost) -->
  <g transform="translate(120, 330)">
    <ellipse cx="0" cy="30" rx="110" ry="12" fill="#000" opacity="0.2"/>
    <path d="M-100,8 C-80,-4 -40,-10 0,-8 C40,-6 80,-2 105,6 C85,12 40,14 0,12 C-40,10 -80,9 -100,8Z" fill="#0f2444"/>
    <ellipse cx="108" cy="8" rx="14" ry="8" fill="#091a33"/>
    <!-- Wings -->
    <path d="M-8,-7 L-32,-48 L40,-46 L52,-7Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <path d="M-8,9 L-32,40 L40,38 L52,9Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <!-- Tail -->
    <path d="M-90,8 L-108,-30 L-75,6Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8"/>
    <path d="M-88,9 L-118,28 L-85,10Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8"/>
    <!-- Windows -->
    <ellipse cx="28" cy="-1" rx="9" ry="6" fill="#38bdf8" opacity="0.25"/>
    <ellipse cx="52" cy="1" rx="9" ry="6" fill="#38bdf8" opacity="0.25"/>
    <ellipse cx="76" cy="3" rx="9" ry="6" fill="#38bdf8" opacity="0.25"/>
    <!-- Prop -->
    <ellipse cx="112" cy="8" rx="4" ry="20" fill="#94a3b8" opacity="0.15"/>
    <!-- Wheels -->
    <circle cx="22" cy="22" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <circle cx="-22" cy="22" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <circle cx="98" cy="12" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" opacity="0.7"/>
    <!-- N-number -->
    <text x="-20" y="6" font-family="monospace" font-size="8" fill="#94a3b8" opacity="0.6">N172PF</text>
    <!-- Model label -->
    <text x="-15" y="50" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle" opacity="0.6" font-weight="600">C172 SKYHAWK</text>
  </g>

  <!-- Aircraft 2 - Cessna 172 (center) -->
  <g transform="translate(400, 320)">
    <ellipse cx="0" cy="32" rx="115" ry="12" fill="#000" opacity="0.2"/>
    <path d="M-105,8 C-85,-4 -42,-10 0,-8 C42,-6 84,-2 110,6 C90,12 42,14 0,12 C-42,10 -85,9 -105,8Z" fill="#0f2444"/>
    <ellipse cx="113" cy="8" rx="14" ry="8" fill="#091a33"/>
    <path d="M-8,-7 L-34,-50 L42,-48 L54,-7Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <path d="M-8,9 L-34,42 L42,40 L54,9Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <path d="M-95,8 L-114,-32 L-79,6Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8"/>
    <path d="M-93,9 L-124,30 L-90,10Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8"/>
    <ellipse cx="30" cy="-1" rx="9" ry="6" fill="#38bdf8" opacity="0.25"/>
    <ellipse cx="55" cy="1" rx="9" ry="6" fill="#38bdf8" opacity="0.25"/>
    <ellipse cx="80" cy="3" rx="9" ry="6" fill="#38bdf8" opacity="0.25"/>
    <ellipse cx="117" cy="8" rx="4" ry="21" fill="#94a3b8" opacity="0.15"/>
    <circle cx="24" cy="22" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <circle cx="-24" cy="22" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <circle cx="102" cy="12" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" opacity="0.7"/>
    <text x="-20" y="6" font-family="monospace" font-size="8" fill="#94a3b8" opacity="0.6">N6814R</text>
    <text x="-15" y="52" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle" opacity="0.6" font-weight="600">C172 SKYHAWK</text>
  </g>

  <!-- Aircraft 3 - Piper PA-28 (rightmost, slightly different shape) -->
  <g transform="translate(670, 335)">
    <ellipse cx="0" cy="28" rx="100" ry="11" fill="#000" opacity="0.2"/>
    <!-- PA-28 has low wing vs high wing C172 -->
    <path d="M-95,5 C-75,-4 -38,-8 0,-6 C38,-4 76,-1 98,5 C78,10 38,12 0,10 C-38,8 -75,7 -95,5Z" fill="#0f2444"/>
    <ellipse cx="100" cy="6" rx="12" ry="7" fill="#091a33"/>
    <!-- Low wing -->
    <path d="M-5,-4 L-28,-6 L-85,-4 L-80,6 L-28,6 L-5,6Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <path d="M-5,-4 L18,-6 L75,-4 L70,6 L18,6 L-5,6Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <!-- Tail -->
    <path d="M-85,5 L-100,-25 L-70,4Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8"/>
    <path d="M-84,6 L-110,22 L-80,7Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8"/>
    <ellipse cx="25" cy="1" rx="8" ry="5" fill="#38bdf8" opacity="0.25"/>
    <ellipse cx="48" cy="2" rx="8" ry="5" fill="#38bdf8" opacity="0.25"/>
    <ellipse cx="70" cy="3" rx="8" ry="5" fill="#38bdf8" opacity="0.25"/>
    <ellipse cx="103" cy="6" rx="4" ry="18" fill="#94a3b8" opacity="0.15"/>
    <circle cx="0" cy="18" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <circle cx="-18" cy="18" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <circle cx="88" cy="10" r="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" opacity="0.7"/>
    <text x="-20" y="4" font-family="monospace" font-size="7" fill="#94a3b8" opacity="0.6">N28PA</text>
    <text x="-10" y="46" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle" opacity="0.6" font-weight="600">PA-28 WARRIOR</text>
  </g>

  <!-- Fleet count badge -->
  <rect x="310" y="460" width="180" height="60" rx="8" fill="#0f2444" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
  <text x="400" y="487" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#38bdf8" text-anchor="middle" font-weight="800" opacity="0.9">6 AIRCRAFT</text>
  <text x="400" y="508" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" opacity="0.6" letter-spacing="2">MODERN TRAINING FLEET</text>

  <!-- Label -->
  <text x="30" y="575" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" opacity="0.7" letter-spacing="3">AIRCRAFT FLEET · POMPANO FLIGHT TRAINING</text>
</svg>
