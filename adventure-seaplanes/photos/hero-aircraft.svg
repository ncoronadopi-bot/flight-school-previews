<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="40%" stop-color="#091a33"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sunGlow)"/>

  <!-- Stars -->
  <g fill="#e2e8f0" opacity="0.4">
    <circle cx="120" cy="80" r="1.2"/><circle cx="340" cy="45" r="1"/><circle cx="580" cy="90" r="1.5"/>
    <circle cx="820" cy="60" r="1"/><circle cx="1060" cy="35" r="1.2"/><circle cx="1280" cy="75" r="1"/>
    <circle cx="200" cy="140" r="0.8"/><circle cx="450" cy="120" r="1.2"/><circle cx="700" cy="155" r="0.8"/>
    <circle cx="950" cy="100" r="1"/><circle cx="1180" cy="130" r="1.5"/><circle cx="1420" cy="95" r="0.8"/>
    <circle cx="1500" cy="160" r="1"/><circle cx="60" cy="200" r="0.8"/><circle cx="1550" cy="50" r="1.2"/>
  </g>

  <!-- Horizon glow -->
  <ellipse cx="1120" cy="480" rx="400" ry="200" fill="#f59e0b" opacity="0.08"/>
  <ellipse cx="1120" cy="500" rx="600" ry="150" fill="#fbbf24" opacity="0.05"/>

  <!-- Clouds -->
  <g fill="#94a3b8" opacity="0.12" filter="url(#blur)">
    <ellipse cx="200" cy="300" rx="180" ry="50"/>
    <ellipse cx="280" cy="290" rx="120" ry="40"/>
    <ellipse cx="1300" cy="250" rx="200" ry="55"/>
    <ellipse cx="1380" cy="240" rx="130" ry="40"/>
    <ellipse cx="700" cy="350" rx="150" ry="45"/>
  </g>

  <!-- Ocean/water at bottom -->
  <rect x="0" y="760" width="1600" height="140" fill="#075985" opacity="0.4"/>
  <rect x="0" y="790" width="1600" height="110" fill="#0369a1" opacity="0.2"/>

  <!-- Runway lights reflected on water -->
  <g opacity="0.15">
    <line x1="750" y1="800" x2="860" y2="900" stroke="#fbbf24" stroke-width="2"/>
    <line x1="800" y1="800" x2="890" y2="900" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Main aircraft silhouette (Cessna-style single engine) -->
  <g transform="translate(680,320) rotate(-8)" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="180" ry="22" fill="#1e3a5f"/>
    <path d="M-180,0 C-160,-8 -80,-12 0,-8 C80,-4 140,0 180,12 C160,16 80,18 0,14 C-80,10 -160,8 -180,0Z" fill="#0f2444"/>
    <!-- Nose -->
    <ellipse cx="180" cy="10" rx="24" ry="12" fill="#0f2444"/>
    <!-- Tail vertical -->
    <path d="M-160,0 L-180,-55 L-130,-8Z" fill="#0f2444" stroke="#38bdf8" stroke-width="1"/>
    <!-- Tail horizontal -->
    <path d="M-155,5 L-195,35 L-150,8Z" fill="#0f2444" stroke="#38bdf8" stroke-width="1"/>
    <path d="M-155,5 L-195,-22 L-150,2Z" fill="#0f2444" stroke="#38bdf8" stroke-width="1"/>
    <!-- Main wing -->
    <path d="M-20,-8 L-60,-80 L60,-80 L80,-8Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M-20,8 L-60,60 L60,60 L80,8Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Wing strut -->
    <line x1="-10" y1="0" x2="0" y2="45" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <!-- Windows -->
    <ellipse cx="60" cy="-4" rx="12" ry="8" fill="#38bdf8" opacity="0.4"/>
    <ellipse cx="90" cy="-3" rx="12" ry="8" fill="#38bdf8" opacity="0.4"/>
    <ellipse cx="120" cy="-1" rx="12" ry="8" fill="#38bdf8" opacity="0.4"/>
    <!-- Landing light -->
    <circle cx="178" cy="8" r="4" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Aircraft glow/contrail -->
  <line x1="480" y1="345" x2="680" y2="328" stroke="#38bdf8" stroke-width="1.5" opacity="0.15" stroke-dasharray="8,6"/>

  <!-- Ground/airfield at horizon -->
  <rect x="0" y="720" width="1600" height="40" fill="#0f2444" opacity="0.6"/>
  <!-- Runway -->
  <g opacity="0.4">
    <rect x="720" y="700" width="160" height="300" fill="#1e293b"/>
    <g fill="#fbbf24" opacity="0.5">
      <rect x="793" y="710" width="14" height="30"/>
      <rect x="793" y="755" width="14" height="30"/>
      <rect x="793" y="800" width="14" height="30"/>
      <rect x="793" y="845" width="14" height="30"/>
      <rect x="793" y="890" width="14" height="30"/>
    </g>
  </g>

  <!-- Branding text -->
  <text x="80" y="820" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0" opacity="0.9" letter-spacing="2">POMPANO FLIGHT TRAINING</text>
  <text x="80" y="855" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" opacity="0.7" letter-spacing="4">KPMP · POMPANO BEACH, FL</text>

  <!-- Corner accent lines -->
  <line x1="0" y1="0" x2="60" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="0" x2="0" y2="60" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <line x1="1600" y1="900" x2="1540" y2="900" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <line x1="1600" y1="900" x2="1600" y2="840" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
</svg>
