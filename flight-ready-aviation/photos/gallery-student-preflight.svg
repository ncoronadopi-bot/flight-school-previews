<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f2444"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Bright sky area -->
  <ellipse cx="400" cy="200" rx="350" ry="200" fill="#0284c7" opacity="0.1"/>

  <!-- Ground -->
  <rect x="0" y="420" width="800" height="180" fill="url(#ground)"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Aircraft wing detail (student is doing pre-flight on wing) -->
  <!-- Large wing plane section -->
  <g transform="translate(400, 350)">
    <!-- Wing surface -->
    <path d="M-300,-30 L-280,-60 L280,-50 L300,-20 L280,0 L-280,0Z" fill="#0f2444" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <!-- Wing ribs/detail -->
    <line x1="-200" y1="-30" x2="-200" y2="0" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
    <line x1="-100" y1="-35" x2="-100" y2="0" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="-38" x2="0" y2="0" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
    <line x1="100" y1="-36" x2="100" y2="0" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
    <line x1="200" y1="-33" x2="200" y2="0" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
    <!-- Fuel cap -->
    <circle cx="120" cy="-18" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Navigation light -->
    <circle cx="295" cy="-22" r="5" fill="#38bdf8" opacity="0.6"/>
    <!-- Aileron outline -->
    <rect x="160" y="-45" width="130" height="40" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" rx="2"/>
  </g>

  <!-- Fuselage partial view -->
  <rect x="100" y="240" width="280" height="170" rx="20" fill="#0f2444" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <!-- Window -->
  <ellipse cx="230" cy="300" rx="45" ry="32" fill="#0284c7" opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Door handle -->
  <rect x="330" y="310" width="18" height="6" rx="3" fill="#38bdf8" opacity="0.5"/>

  <!-- Student figure (simplified silhouette) -->
  <g transform="translate(490, 290)" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1">
    <!-- Head -->
    <circle cx="0" cy="-80" r="22" fill="#0f2444"/>
    <!-- Helmet/headset -->
    <path d="M-22,-80 Q-28,-100 0,-105 Q28,-100 22,-80" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="-28" y="-90" width="8" height="18" rx="3" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <rect x="20" y="-90" width="8" height="18" rx="3" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <!-- Body/flight suit -->
    <path d="M-20,-58 L-25,0 L25,0 L20,-58Z" fill="#0f2444"/>
    <!-- Arms (reaching forward, inspecting) -->
    <path d="M-20,-40 L-70,-20 L-65,-10 L-15,-30Z" fill="#0f2444"/>
    <path d="M20,-40 L55,-15 L50,-5 L15,-30Z" fill="#0f2444"/>
    <!-- Legs -->
    <rect x="-20" y="0" width="16" height="70" rx="4" fill="#0c4a6e"/>
    <rect x="4" y="0" width="16" height="70" rx="4" fill="#0c4a6e"/>
    <!-- Feet/boots -->
    <ellipse cx="-12" cy="72" rx="12" ry="6" fill="#0f172a"/>
    <ellipse cx="12" cy="72" rx="12" ry="6" fill="#0f172a"/>
    <!-- Clipboard in hand -->
    <rect x="-80" y="-25" width="24" height="30" rx="2" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
    <line x1="-76" y1="-18" x2="-60" y2="-18" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
    <line x1="-76" y1="-12" x2="-60" y2="-12" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
    <line x1="-76" y1="-6" x2="-60" y2="-6" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Checklist text -->
  <text x="540" y="180" font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.5" font-weight="600">PRE-FLIGHT CHECKLIST</text>
  <text x="540" y="200" font-family="monospace" font-size="10" fill="#94a3b8" opacity="0.4">✓ Engine oil</text>
  <text x="540" y="215" font-family="monospace" font-size="10" fill="#94a3b8" opacity="0.4">✓ Fuel level</text>
  <text x="540" y="230" font-family="monospace" font-size="10" fill="#38bdf8" opacity="0.5">→ Control surfaces</text>
  <text x="540" y="245" font-family="monospace" font-size="10" fill="#94a3b8" opacity="0.3">  Avionics</text>
  <text x="540" y="260" font-family="monospace" font-size="10" fill="#94a3b8" opacity="0.3">  Weather briefing</text>

  <!-- Label -->
  <text x="30" y="570" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" opacity="0.7" letter-spacing="3">STUDENT PRE-FLIGHT INSPECTION</text>
</svg>
