<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2f1a"/>
      <stop offset="100%" stop-color="#0f1f0f"/>
    </linearGradient>
  </defs>

  <!-- Ocean background -->
  <rect width="800" height="600" fill="url(#ocean)"/>

  <!-- Sky at top (aerial, looking slightly down) -->
  <rect width="800" height="100" fill="#0c4a6e" opacity="0.5"/>

  <!-- Water texture -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="150" x2="800" y2="155"/>
    <line x1="0" y1="200" x2="800" y2="205"/>
    <line x1="0" y1="250" x2="800" y2="248"/>
    <line x1="0" y1="300" x2="800" y2="302"/>
    <line x1="0" y1="350" x2="800" y2="348"/>
    <line x1="0" y1="400" x2="800" y2="402"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="550" x2="800" y2="550"/>
  </g>

  <!-- Intracoastal waterway -->
  <path d="M180,0 Q160,150 170,300 Q180,450 160,600" fill="none" stroke="#38bdf8" stroke-width="30" opacity="0.25"/>

  <!-- Land mass (Pompano Beach) -->
  <path d="M200,0 L800,0 L800,600 L200,600 Q220,450 210,300 Q200,150 200,0Z" fill="url(#land)" opacity="0.85"/>

  <!-- Streets/roads grid -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.12">
    <line x1="250" y1="0" x2="250" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>

    <line x1="200" y1="100" x2="800" y2="100"/>
    <line x1="200" y1="180" x2="800" y2="180"/>
    <line x1="200" y1="260" x2="800" y2="260"/>
    <line x1="200" y1="340" x2="800" y2="340"/>
    <line x1="200" y1="420" x2="800" y2="420"/>
    <line x1="200" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Pompano Beach Airpark (KPMP) - the main feature -->
  <!-- Airport boundary -->
  <rect x="260" y="150" width="340" height="280" rx="8" fill="#0f172a" opacity="0.7" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Main runway 10/28 (roughly E-W) -->
  <rect x="270" y="270" width="320" height="28" rx="4" fill="#1e293b"/>
  <!-- Runway markings -->
  <g fill="#fbbf24" opacity="0.5">
    <rect x="285" y="280" width="20" height="8"/>
    <rect x="315" y="280" width="20" height="8"/>
    <rect x="345" y="280" width="20" height="8"/>
    <rect x="375" y="280" width="20" height="8"/>
    <rect x="405" y="280" width="20" height="8"/>
    <rect x="435" y="280" width="20" height="8"/>
    <rect x="465" y="280" width="20" height="8"/>
    <rect x="495" y="280" width="20" height="8"/>
    <rect x="525" y="280" width="20" height="8"/>
    <rect x="555" y="280" width="20" height="8"/>
  </g>
  <!-- Runway numbers -->
  <text x="280" y="278" font-family="monospace" font-size="12" fill="#fbbf24" opacity="0.6" font-weight="bold">10</text>
  <text x="556" y="278" font-family="monospace" font-size="12" fill="#fbbf24" opacity="0.6" font-weight="bold">28</text>

  <!-- Crosswind runway (10L/28R area) -->
  <g transform="translate(430, 290) rotate(-30)">
    <rect x="-140" y="-12" width="280" height="20" rx="3" fill="#1e293b" opacity="0.7"/>
    <g fill="#fbbf24" opacity="0.3">
      <rect x="-120" y="-4" width="15" height="8"/>
      <rect x="-90" y="-4" width="15" height="8"/>
      <rect x="-60" y="-4" width="15" height="8"/>
      <rect x="-30" y="-4" width="15" height="8"/>
      <rect x="0" y="-4" width="15" height="8"/>
      <rect x="30" y="-4" width="15" height="8"/>
      <rect x="60" y="-4" width="15" height="8"/>
      <rect x="90" y="-4" width="15" height="8"/>
    </g>
  </g>

  <!-- Taxiways -->
  <g stroke="#38bdf8" stroke-width="3" opacity="0.25" fill="none">
    <path d="M280,298 L280,390 L380,390"/>
    <path d="M590,298 L590,390 L380,390"/>
    <path d="M380,390 L380,420"/>
  </g>

  <!-- Apron / parking area -->
  <rect x="310" y="380" width="180" height="60" rx="4" fill="#1e293b" opacity="0.6"/>
  <!-- Parked aircraft (tiny dots) -->
  <g fill="#38bdf8" opacity="0.5">
    <ellipse cx="330" cy="405" rx="8" ry="4"/>
    <ellipse cx="355" cy="405" rx="8" ry="4"/>
    <ellipse cx="380" cy="405" rx="8" ry="4"/>
    <ellipse cx="405" cy="405" rx="8" ry="4"/>
    <ellipse cx="430" cy="405" rx="8" ry="4"/>
    <ellipse cx="455" cy="405" rx="8" ry="4"/>
  </g>

  <!-- FBO/Terminal buildings -->
  <g fill="#0f2444" stroke="#38bdf8" stroke-width="0.5" opacity="0.8">
    <rect x="340" y="160" width="60" height="40" rx="3"/>
    <rect x="410" y="160" width="80" height="35" rx="3"/>
    <rect x="500" y="165" width="50" height="30" rx="3"/>
  </g>

  <!-- KPMP label -->
  <g transform="translate(380, 310)">
    <rect x="-35" y="-15" width="70" height="24" rx="4" fill="#fbbf24" opacity="0.15"/>
    <text font-family="monospace" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="bold" opacity="0.8">KPMP</text>
  </g>

  <!-- Aircraft in the air (overhead) -->
  <g transform="translate(130, 80) rotate(15)" fill="#e2e8f0" opacity="0.5">
    <ellipse cx="0" cy="0" rx="18" ry="4"/>
    <path d="M-4,-3 L-12,-14 L8,-13 L10,-3Z" fill="#e2e8f0"/>
    <path d="M-4,3 L-12,12 L8,11 L10,3Z" fill="#e2e8f0"/>
    <path d="M-15,1 L-20,5 L-18,1 L-20,-3 L-15,-1Z" fill="#e2e8f0"/>
  </g>

  <!-- Compass rose in corner -->
  <g transform="translate(720, 520)">
    <circle r="30" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
    <text y="-15" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle" opacity="0.6" font-weight="bold">N</text>
    <line x1="0" y1="-12" x2="0" y2="-25" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <text y="22" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle" opacity="0.4">S</text>
    <text x="18" y="5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle" opacity="0.4">E</text>
    <text x="-18" y="5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle" opacity="0.4">W</text>
  </g>

  <!-- Label -->
  <text x="30" y="575" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" opacity="0.7" letter-spacing="3">AERIAL VIEW · POMPANO BEACH AIRPARK</text>
</svg>
